# Atlas en el servidor. Se despliega solo por digest con deploy/desplegar.sh, nunca por tag.
# Solo escucha en 127.0.0.1: se publica en la red privada con `tailscale serve`, nunca con Funnel.
name: atlas

services:
  atlas:
    image: ${ATLAS_IMAGEN:?falta ATLAS_IMAGEN, una imagen por digest}
    container_name: atlas
    user: "${ATLAS_UID:?falta ATLAS_UID}:${ATLAS_GID:?falta ATLAS_GID}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    env_file:
      - atlas.env
    environment:
      ATLAS_TOKEN_FILE: /run/secrets/github_token
    secrets:
      - github_token
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

secrets:
  github_token:
    file: ./secrets/github_token
